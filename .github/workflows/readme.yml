name: Update Profile README

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Activity Graph
        uses: Ashish2804/github-readme-activity-graph@v1.0.0
        with:
          username: Angel-p-v
          theme: react-dark
          hide_border: true
          area: true
          mode: total
          custom_title: Actividad reciente

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update profile widgets" || echo "No changes to commit"
          git push
